<title>Jarvis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Oxanium:wght@500;600;700&display=swap">
<style>
/* Layout: one screen. A 3D core in the middle of the stage, key-point callouts docked left and
   right of it with leader lines into the core, the spoken line under it, the talk dock at the bottom.
   Deliberately one dark look: the core is a light source and needs a dark room. */
:root{
  color-scheme:dark;
  --room:#070B14; --room-2:#0C1220; --panel:#101828; --panel-2:#16203A;
  --line:#243150; --line-soft:#18223A;
  --ink:#E6EEFB; --ink-2:#A3B2CE; --ink-3:#6C7C9C;
  --core:#6FD8FF; --core-dim:#2B6F8F; --think:#FFB454;
  --k-beslut:#FFB454; --k-fakta:#6FD8FF; --k-uppgift:#7CE0A6; --k-fraga:#B79CFF; --k-ide:#FF8FC0;
  --danger:#FF7A6B;
  --display:'Oxanium','Segoe UI',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:4px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--room);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--core);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:8px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(120% 80% at 50% 38%,var(--room-2) 0%,var(--room) 62%)}

/* top bar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.22em}
.status{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--core);box-shadow:0 0 10px var(--core)}
.app[data-phase="thinking"] .status i{background:var(--think);box-shadow:0 0 10px var(--think)}
.app[data-phase="listening"] .status i{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.links{display:flex;gap:6px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.links span{border:1px solid var(--line-soft);border-radius:var(--r);padding:3px 7px}
.links span.on{color:var(--k-uppgift);border-color:color-mix(in srgb,var(--k-uppgift) 45%,transparent)}
.tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.tool{background:transparent;border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.tool:hover{border-color:var(--core-dim);color:var(--ink)}
.tool[aria-pressed="true"]{border-color:var(--core);color:var(--core)}
.tool.warn{border-color:var(--danger);color:var(--danger)}
.tool b{font-weight:500;color:var(--ink)}

/* stage */
.stage{position:relative;min-height:0;min-width:0;display:flex;flex-direction:column;gap:8px}
.orbwrap{position:relative;flex:1;min-height:160px}
#core{position:absolute;inset:0;width:100%;height:100%;display:block}
.orb-fallback{position:absolute;left:50%;top:50%;width:min(46vmin,300px);aspect-ratio:1;max-width:100%;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 50% 50%,var(--core) 0%,var(--core-dim) 28%,transparent 66%);opacity:.8}
#leads{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#leads line{stroke:var(--line);stroke-width:1}
#leads circle{fill:var(--room);stroke-width:1.5}

/* key-point callouts */
#cards{position:absolute;inset:0;pointer-events:none;perspective:1100px}
.card{--k:var(--k-fakta);position:absolute;width:clamp(210px,23vw,300px);pointer-events:auto;
  background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-top:2px solid var(--k);border-radius:var(--r);
  padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;box-shadow:0 18px 40px -18px #000;
  animation:pop .5s cubic-bezier(.2,.9,.25,1) both}
.card.L{left:0;transform:rotateY(9deg);transform-origin:left center}
.card.R{right:0;transform:rotateY(-9deg);transform-origin:right center}
.card.s1{top:4%}.card.s2{top:36%}.card.s3{top:68%}
@keyframes pop{from{opacity:0;filter:blur(6px);translate:0 14px;scale:.92}to{opacity:1;filter:none;translate:0 0;scale:1}}
.card-head{display:flex;align-items:center;gap:8px}
.kind{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--k)}
.card-head .sp{flex:1}
.icon{background:transparent;border:0;padding:2px 5px;font-family:var(--mono);font-size:12px;color:var(--ink-3);border-radius:var(--r)}
.icon:hover{color:var(--ink)}
.icon[aria-pressed="true"]{color:var(--k)}
.card h3{margin:0;font-family:var(--display);font-weight:600;font-size:15px;line-height:1.2;text-wrap:balance;overflow-wrap:anywhere}
.card p{margin:0;font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.card p.more{font-size:12.5px;color:var(--ink-3);border-top:1px solid var(--line-soft);padding-top:6px}
.card.open{z-index:5;border-color:var(--k)}
.card .meta{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--ink-3);font-variant-numeric:tabular-nums}
.readout{position:absolute;left:0;right:0;bottom:2px;display:flex;justify-content:center;gap:14px;flex-wrap:wrap;pointer-events:none;
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-variant-numeric:tabular-nums}
.readout b{font-weight:500;color:var(--ink-2)}
.log li.turn{border-left-color:var(--line)}
.log li.turn.j{border-left-color:var(--core)}
.log li .when{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.log li .body{font-size:13.5px;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.log li .det{font-size:12.5px;color:var(--ink-3)}
.card.demo{border-style:dashed;border-top-style:solid;opacity:.7}
.k-beslut{--k:var(--k-beslut)}.k-fakta{--k:var(--k-fakta)}.k-uppgift{--k:var(--k-uppgift)}.k-fraga{--k:var(--k-fraga)}.k-ide{--k:var(--k-ide)}

/* spoken lines */
.caption{display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;min-height:74px;max-height:30vh;overflow-y:auto;flex:none}
.you{font-family:var(--mono);font-size:12px;color:var(--ink-3);max-width:70ch;overflow-wrap:anywhere}
.you.live{color:var(--ink-2)}
.say{font-size:16px;max-width:74ch;text-wrap:balance;overflow-wrap:anywhere}
.say.err{color:var(--danger);font-size:14px}

/* dock */
.dock{display:flex;gap:8px;align-items:center;max-width:760px;width:100%;margin-inline:auto}
.mic{flex:none;width:52px;height:52px;border-radius:50%;border:1px solid var(--core);background:var(--panel);color:var(--core);
  display:grid;place-items:center}
.mic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.mic[aria-pressed="true"]{background:var(--core);color:var(--room);box-shadow:0 0 0 6px color-mix(in srgb,var(--core) 22%,transparent)}
.field{flex:1;min-width:0;display:flex;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.field:focus-within{border-color:var(--core-dim)}
.field input{flex:1;min-width:0;background:transparent;border:0;padding:14px 12px;font-size:16px;outline:none}
.field input::placeholder{color:var(--ink-3)}
.send{background:transparent;border:0;border-left:1px solid var(--line);padding:0 16px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--core)}
.send:disabled{color:var(--ink-3);cursor:default}
.hint{font-family:var(--mono);font-size:11px;color:var(--ink-3);text-align:center;margin:0}

/* log drawer */
.log{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:20;
  display:flex;flex-direction:column;gap:10px;padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) 16px}
.log header{display:flex;align-items:center;gap:8px}
.log h2{margin:0;font-family:var(--display);font-size:16px;letter-spacing:.12em;text-transform:uppercase;flex:1}
.log ul{list-style:none;margin:0;padding:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:0}
.log li{--k:var(--k-fakta);border-left:2px solid var(--k);padding:2px 0 2px 10px;display:flex;flex-direction:column;gap:2px}
.log li strong{font-family:var(--display);font-weight:600;font-size:14px;overflow-wrap:anywhere}
.log li span{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.log .row{display:flex;gap:4px;align-items:center}
.log .empty{color:var(--ink-3);font-size:13px}

@media (max-width:859px){
  #leads{display:none}
  #cards{position:static;display:flex;gap:8px;overflow-x:auto;perspective:none;pointer-events:auto;padding-bottom:2px;flex:none}
  #cards:empty{display:none}
  .card,.card.L,.card.R{position:static;transform:none;flex:none;width:min(78vw,280px)}
  .orbwrap{min-height:140px}
  .say{font-size:15px}
  .caption{min-height:60px;max-height:22vh}
  .hint{display:none}
  .readout{display:none}
}
@media (prefers-reduced-motion:reduce){
  .card{animation:none}
  .app[data-phase="listening"] .status i{animation:none}
}
</style>

<div class="app" id="app" data-phase="idle">
  <header class="top">
    <span class="brand">JARVIS</span>
    <span class="status"><i></i><span id="statusText">Startar</span></span>
    <span class="links" id="links"><span id="webChip" title="Webben nås via Claude-appens inbyggda webbläsare på datorn">Webb av</span></span>
    <div class="tools">
      <button class="tool" id="langBtn" type="button" title="Språk Jarvis lyssnar och svarar på">Språk <b id="langVal">SV</b></button>
      <button class="tool" id="voiceBtn" type="button" aria-pressed="true">Röst på</button>
      <button class="tool" id="distillBtn" type="button" title="Gå igenom hela konversationen och plocka ut de viktigaste punkterna">Destillera</button>
      <button class="tool" id="logBtn" type="button">Punkter <b id="logCount">0</b></button>
      <button class="tool" id="talkBtn" type="button">Samtal <b id="talkCount">0</b></button>
      <button class="tool" id="resetBtn" type="button">Ny konvo</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="orbwrap" id="orbwrap">
      <div class="orb-fallback" id="orbFallback"></div>
      <div class="readout" aria-hidden="true"><span>Tid <b id="roClock">--:--:--</b></span><span>Repliker <b id="roTurns">0</b></span><span>Punkter <b id="roPoints">0</b></span><span>Senaste svar <b id="roLatency">–</b></span></div>
      <canvas id="core" aria-label="Jarvis 3D-kärna"></canvas>
    </div>
    <svg id="leads" aria-hidden="true"></svg>
    <div id="cards" aria-live="polite"></div>
    <div class="caption">
      <div class="you" id="you"></div>
      <div class="say" id="say">Säg något eller skriv nedan. De viktigaste punkterna dyker upp runt kärnan medan vi pratar.</div>
    </div>
  </main>

  <footer>
    <form class="dock" id="form">
      <button class="mic" id="micBtn" type="button" aria-pressed="false" aria-label="Prata med Jarvis" hidden>
        <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <div class="field">
        <input id="text" type="text" autocomplete="off" placeholder="Skriv till Jarvis" aria-label="Meddelande till Jarvis">
        <button class="send" id="sendBtn" type="submit">Skicka</button>
      </div>
    </form>
    <p class="hint" id="hint">&nbsp;</p>
  </footer>

  <aside class="log" id="talk" hidden>
    <header><h2>Samtalet</h2><button class="tool" id="talkClose" type="button">Stäng</button></header>
    <ul id="talkList"></ul>
  </aside>

  <aside class="log" id="log" hidden>
    <header><h2>Viktigaste punkterna</h2><button class="tool" id="logClose" type="button">Stäng</button></header>
    <ul id="logList"></ul>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
const $ = id => document.getElementById(id);
const app = $("app"), stage = $("stage"), orbwrap = $("orbwrap"), cardsEl = $("cards"), leads = $("leads");
const youEl = $("you"), sayEl = $("say"), textEl = $("text"), micBtn = $("micBtn"), hintEl = $("hint");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- state ---------- */
const KINDS = { beslut:"Beslut", fakta:"Fakta", uppgift:"Uppgift", fraga:"Öppen fråga", ide:"Idé" };
const SLOTS = ["R s1","L s1","R s2","L s2","R s3","L s3"];
const DEMO = [
  { id:"d1", kind:"beslut", title:"Så här ser ett beslut ut", text:"När vi bestämmer något i samtalet fäster Jarvis det här.", demo:true, visible:true, slot:0 },
  { id:"d2", kind:"uppgift", title:"Och så här en uppgift", text:"Saker någon ska göra hamnar som egna kort. Exemplen försvinner när du börjar prata.", demo:true, visible:true, slot:1 }
];
const store = {
  get(k, d){ try{ const v = localStorage.getItem("jarvis."+k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("jarvis."+k, JSON.stringify(v)); }catch(e){} }
};
let turns  = store.get("turns", []);      // [{role:"user"|"jarvis", text}]
let points = store.get("points", []);     // [{id, kind, title, text, pinned, visible, slot}]
let lang   = store.get("lang", "sv");
let voiceOn = store.get("voice", true);
let busy = false, listening = false, speaking = false, abortCtl = null;
let sample = null, dictation = null, tts = null, ttsLangs = null, capsReady = false;
let dictBuf = "", sendTimer = null;
let mcp = null, webOn = false, toolsOk = false;
const BROWSER = "host:claude_browser";

function save(){ store.set("turns", turns.slice(-60)); store.set("points", points); }
const uid = () => Math.random().toString(36).slice(2, 9);

/* ---------- phase ---------- */
const PHASE_TEXT = { idle:"Redo", listening:"Lyssnar", thinking:"Tänker", speaking:"Talar" };
function phase(){ return listening ? "listening" : speaking ? "speaking" : busy ? "thinking" : "idle"; }
function syncPhase(){
  const p = phase();
  app.dataset.phase = p;
  $("statusText").textContent = !capsReady ? "Startar" : !sample ? "Hjärnan ej ansluten" : PHASE_TEXT[p];
  micBtn.setAttribute("aria-pressed", String(listening));
  $("sendBtn").disabled = busy;
  core.setPhase(p);
}

/* ---------- key-point cards ---------- */
function shown(){ return (points.length || turns.length) ? points : DEMO; }
function placePoint(p){
  const used = new Set(points.filter(q => q.visible && q !== p).map(q => q.slot));
  let slot = SLOTS.findIndex((_, i) => !used.has(i));
  if (slot < 0){
    const victim = points.find(q => q.visible && !q.pinned && q !== p);
    if (!victim){ p.visible = false; return; }
    victim.visible = false; slot = victim.slot;
  }
  p.slot = slot; p.visible = true;
}
const KCOL = { beslut:0xFFB454, fakta:0x6FD8FF, uppgift:0x7CE0A6, fraga:0xB79CFF, ide:0xFF8FC0 };
const nextNo = () => points.reduce((m, q) => Math.max(m, q.n || 0), 0) + 1;
const pad2 = n => String(n).padStart(2, "0");
const hhmm = t => { if (!t) return ""; const d = new Date(t); return pad2(d.getHours()) + ":" + pad2(d.getMinutes()); };
function addPoints(list){
  let added = 0;
  for (const raw of list){
    if (!raw || typeof raw !== "object") continue;
    const title = String(raw.rubrik || raw.title || "").trim().slice(0, 80);
    const text  = String(raw.text || "").trim().slice(0, 240);
    const detail = String(raw.detalj || raw.detail || "").trim().slice(0, 600);
    if (!title) continue;
    if (points.some(q => q.title.toLowerCase() === title.toLowerCase())) continue;
    const kind = KINDS[raw.typ] ? raw.typ : KINDS[raw.kind] ? raw.kind : "fakta";
    const p = { id:uid(), kind, title, text, detail, n:nextNo(), at:Date.now(), open:false, pinned:false, visible:true, slot:0 };
    points.push(p); placePoint(p); added++;
  }
  if (added){ core.pulse(); save(); renderCards(); }
  return added;
}
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function renderCards(){
  const list = shown().filter(p => p.visible);
  const keep = new Set(list.map(p => p.id));
  for (const c of [...cardsEl.children]) if (!keep.has(c.dataset.id)) c.remove();
  for (const p of list){
    let c = cardsEl.querySelector('[data-id="'+p.id+'"]');
    if (!c){
      c = el("article"); c.dataset.id = p.id;
      const head = el("div", "card-head");
      head.append(el("span", "kind", p.demo ? "Exempel · " + KINDS[p.kind] : (p.n ? "#" + pad2(p.n) + " · " : "") + KINDS[p.kind]), el("span", "sp"));
      if (p.at) head.append(el("span", "meta", hhmm(p.at)));
      if (p.detail){ const m = el("button", "icon", "mer"); m.type = "button"; m.dataset.act = "more"; head.append(m); }
      if (!p.demo){
        const pin = el("button", "icon", "fäst"); pin.type = "button"; pin.dataset.act = "pin";
        const x = el("button", "icon", "✕"); x.type = "button"; x.dataset.act = "hide"; x.setAttribute("aria-label", "Dölj punkten");
        head.append(pin, x);
      }
      c.append(head, el("h3", "", p.title));
      if (p.text) c.append(el("p", "", p.text));
      if (p.detail) c.append(el("p", "more", p.detail));
      cardsEl.append(c);
    }
    c.className = "card k-" + p.kind + " " + SLOTS[p.slot % SLOTS.length] + (p.demo ? " demo" : "");
    if (p.open) c.classList.add("open");
    const more = c.querySelector("p.more"), mb = c.querySelector('[data-act="more"]');
    if (more) more.hidden = !p.open;
    if (mb){ mb.textContent = p.open ? "mindre" : "mer"; mb.setAttribute("aria-expanded", String(!!p.open)); }
    const pin = c.querySelector('[data-act="pin"]');
    if (pin){ pin.setAttribute("aria-pressed", String(!!p.pinned)); pin.textContent = p.pinned ? "fäst ●" : "fäst"; }
  }
  $("logCount").textContent = String(points.length);
  $("roPoints").textContent = String(points.length);
  core.setNodes(points.slice(-24).map(q => KCOL[q.kind] || KCOL.fakta));
  renderLog();
  requestAnimationFrame(drawLeads);
}
cardsEl.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const p = points.find(q => q.id === b.closest(".card").dataset.id); if (!p) return;
  if (b.dataset.act === "pin") p.pinned = !p.pinned;
  else if (b.dataset.act === "more") p.open = !p.open;
  else p.visible = false;
  save(); renderCards();
});

/* leader lines from each callout into the core (desktop layout only) */
const NS = "http://www.w3.org/2000/svg";
function drawLeads(){
  leads.replaceChildren();
  if (getComputedStyle(leads).display === "none") return;
  const cx = orbwrap.offsetLeft + orbwrap.offsetWidth / 2, cy = orbwrap.offsetTop + orbwrap.offsetHeight / 2;
  const R = Math.min(orbwrap.offsetWidth, orbwrap.offsetHeight) * 0.3;
  for (const c of cardsEl.children){
    const left = c.classList.contains("L");
    const x1 = left ? c.offsetLeft + c.offsetWidth : c.offsetLeft, y1 = c.offsetTop + 18;
    const dx = cx - x1, dy = cy - y1, d = Math.hypot(dx, dy) || 1;
    if (d <= R) continue;
    const x2 = cx - dx / d * R, y2 = cy - dy / d * R;
    const ln = document.createElementNS(NS, "line");
    ln.setAttribute("x1", x1); ln.setAttribute("y1", y1); ln.setAttribute("x2", x2); ln.setAttribute("y2", y2);
    const dot = document.createElementNS(NS, "circle");
    dot.setAttribute("cx", x2); dot.setAttribute("cy", y2); dot.setAttribute("r", 3);
    dot.style.stroke = getComputedStyle(c).getPropertyValue("--k");
    leads.append(ln, dot);
  }
}
addEventListener("resize", () => requestAnimationFrame(drawLeads));

/* log drawer */
function renderLog(){
  const ul = $("logList"); ul.replaceChildren();
  if (!points.length){ ul.append(el("li", "empty", "Inga punkter än. De kommer när samtalet innehåller något värt att spara: beslut, siffror, uppgifter, öppna frågor.")); return; }
  for (const p of [...points].reverse()){
    const li = el("li", "k-" + p.kind); li.dataset.id = p.id;
    const row = el("div", "row");
    row.append(el("span", "kind", KINDS[p.kind]), el("span", "sp"));
    const show = el("button", "icon", p.visible ? "dölj" : "visa"); show.type = "button"; show.dataset.act = "toggle";

const MARK = "@@PUNKTER";
function buildPrompt(userText){

  const known = points.length ? points.map(p => "- [" + p.kind + "] " + p.title + ": " + p.text).join("\n") : "(inga än)";
  const hist = turns.slice(-16).map(t => (t.role === "user" ? "Användaren: " : "Jarvis: ") + t.text).join("\n");
  return [
    "Du är Jarvis, en allmän AI-assistent som man pratar med. Du hjälper till med vad som helst: frågor, förklaringar, idéer, planering, text, kod, beslut. Ditt svar läses upp högt, så skriv talspråk utan markdown, listor eller emojis.",
    "Var detaljerad och konkret: ge siffror, namn, steg, exempel och skälen bakom, inte allmänna fraser. Normalt 3 till 6 meningar; kortare bara för småprat och ja- eller nej-frågor, längre när användaren ber om en genomgång. Börja med själva svaret och bygg sedan på med detaljerna.",
    "Svara på " + langName + ". Var rak och ärlig, även när det är obekvämt.",
    "Dagens datum: " + new Date().toISOString().slice(0, 10) + ".",
    "",
    sourcesBlock(),
    "",
    "Efter svaret skriver du på en egen rad exakt " + MARK + " och därefter en JSON-array med 0 till 3 NYA nyckelpunkter från det senaste utbytet som är värda att minnas: beslut, fakta eller siffror, uppgifter, öppna frågor, idéer. Småprat och hälsningar ger en tom array []. Upprepa aldrig en punkt som redan finns. Skriv punkterna på " + langName + ".",
    'Format: [{"typ":"beslut|fakta|uppgift|fraga|ide","rubrik":"högst 6 ord","text":"en kort mening med det viktigaste","detalj":"2 till 3 meningar: de exakta siffrorna, namnen eller stegen, varför det spelar roll och vad som återstår"}]',
    "Använd aldrig tecknen @@ någon annanstans.",
    "",
    "Punkter som redan finns:", known,
    "",
    "Samtalet hittills:", hist || "(nytt samtal)",
    "",
    "Användaren: " + userText,

const sleep = ms => new Promise(r => setTimeout(r, ms));
function resultText(r){
  const p = r && r.payload;
  if (typeof p === "string") return p;
  if (p != null) return JSON.stringify(p);
  return ((r && r.content) || []).filter(b => b.type === "text").map(b => b.text).join("\n");
}
function webFail(e){
  const c = e && e.code;
  if (c === "server_not_connected" || c === "capability_disabled" || c === "not_granted"){ webOn = false; syncLinks(); return "Webben nås bara när sidan är öppen i Claude-appen på datorn."; }
  if (c === "cancelled" || c === "approval_required" || c === "not_in_manifest") return "Användaren godkände inte att sidan öppnades.";
  if (c === "blocked_by_policy") return "Den sajten är spärrad.";
  if (c === "tool_error") return "Webbläsaren kunde inte öppna sidan: " + String(e.message || "").slice(0, 200);
  return "Webbläsaren svarade inte (" + (c || "okänt fel") + ").";
}
async function readUrl(url, signal){
  if (!/^https?:\/\//i.test(url)) throw new Error("Bara http- och https-adresser går att läsa.");
  try{
    try{ await mcp.callTool(BROWSER, "navigate", { url }, { signal, cache:false }); }
    catch(e){
      // no tab to navigate yet: open one at the address instead
      if (e && e.code === "tool_error") await mcp.callTool(BROWSER, "preview_start", { url }, { signal, cache:false });
      else throw e;
    }
    await sleep(1500);
    const r = await mcp.callTool(BROWSER, "get_page_text", {}, { signal, cache:false });
    return resultText(r).replace(/\s+/g, " ").slice(0, 9000);
  }catch(e){ throw new Error(e && e.code ? webFail(e) : String(e && e.message || e)); }
}
function liveTools(){
  if (!toolsOk) return null;

    name:"webb_sok",

    execute(input, ctx){ return readUrl("https://duckduckgo.com/html/?q=" + encodeURIComponent(String(input.fraga || "").slice(0, 200)), ctx.signal); }
  }, {
    name:"webb_las",
    description:"Öppnar en webbadress just nu och returnerar sidans text, högst cirka 9000 tecken.",
    inputSchema:{ type:"object", properties:{ url:{ type:"string", description:"Fullständig https-adress" } }, required:["url"] },
    execute(input, ctx){ return readUrl(String(input.url || ""), ctx.signal); }

  return tools.length ? tools : null;
}

function parsePoints(tail){
  const a = tail.indexOf("["), b = tail.lastIndexOf("]");
  if (a < 0 || b <= a) return [];
  try{ const v = JSON.parse(tail.slice(a, b + 1)); return Array.isArray(v) ? v : []; }catch(e){ return []; }
}
const clean = s => s.replace(/[*_#`]/g, "").replace(/\s+/g, " ").trim();

function fail(msg){ sayEl.textContent = msg; sayEl.classList.add("err"); }
function explain(e){
  const c = e && e.code;
  if (c === "not_granted") return "Du har inte gett sidan lov att fråga Claude. Tillåt det i sidans behörighetsmeny, sedan fungerar Jarvis.";
  if (c === "rate_limited") return "För många frågor just nu. Vänta en liten stund och försök igen.";
  if (c === "cancelled") return "Avbrutet.";
  return "Jarvis fick inget svar (" + (c || "okänt fel") + "). Försök igen.";
}

async function ask(userText){
  userText = userText.trim();
  if (!userText || busy) return;
  if (!sample){ fail(capsReady ? "Jarvis hjärna är bara ansluten när sidan öppnas inloggad på claude.ai." : "Jarvis startar fortfarande. Försök om ett par sekunder."); return; }
  if (tts) tts.stop().catch(() => {});
  const firstReal = !turns.length && !points.length;
  youEl.textContent = userText; youEl.classList.remove("live");
  sayEl.classList.remove("err"); sayEl.textContent = "…";
  busy = true; syncPhase();
  const prompt = buildPrompt(userText);   // built before the turn is stored, so the message is not sent twice
  turns.push({ role:"user", text:userText, at:Date.now() }); save(); renderTalk();
  const t0 = performance.now();
  if (firstReal) renderCards();           // clears the example cards
  abortCtl = new AbortController();
  let full = "";
  try{
    const opts = {
      cache:false, signal:abortCtl.signal,
      onText: u => { full = u.text; const t = clean(full.split("@@")[0]); if (t) sayEl.textContent = t; }
    };
    const tools = liveTools();
    if (tools) opts.tools = tools;
    const res = await sample(prompt, opts);
    full = res.text || full;
  }catch(e){
    busy = false; syncPhase();
    turns.pop(); save(); renderTalk();
    fail(explain(e)); return;
  }
  const cut = full.indexOf("@@");
  const reply = clean(cut < 0 ? full : full.slice(0, cut)) || "…";
  sayEl.textContent = reply;
  turns.push({ role:"jarvis", text:reply, at:Date.now() }); save(); renderTalk();
  $("roLatency").textContent = ((performance.now() - t0) / 1000).toFixed(1) + " s";
  busy = false; syncPhase();
  if (cut >= 0) addPoints(parsePoints(full.slice(cut)));
  renderCards();
  speak(reply);
}

async function distill(){
  if (busy || !sample || !turns.length){ if (!turns.length) fail("Det finns inget samtal att destillera än."); return; }
  if (tts) tts.stop().catch(() => {});
  busy = true; syncPhase(); sayEl.classList.remove("err");
  const langName = lang === "sv" ? "svenska" : "English";
  const hist = turns.slice(-60).map(t => (t.role === "user" ? "Användaren: " : "Jarvis: ") + t.text).join("\n");
  const pinned = points.filter(p => p.pinned).map(p => "- " + p.title).join("\n") || "(inga)";
  try{
    const out = await sample.json(
      "Läs samtalet nedan och plocka ut de högst 6 viktigaste punkterna: beslut, fakta eller siffror, uppgifter, öppna frågor, idéer. Ta bara med sådant som faktiskt sades. Viktigast först. Skriv på " + langName + ".\n" +
      "Dessa punkter är redan fästa, upprepa dem inte:\n" + pinned + "\n\n" +
      'Svara med enbart en JSON-array: [{"typ":"beslut|fakta|uppgift|fraga|ide","rubrik":"högst 6 ord","text":"en kort mening med det viktigaste","detalj":"2 till 3 meningar: de exakta siffrorna, namnen eller stegen, varför det spelar roll och vad som återstår"}]\n\nSamtalet:\n' + hist,

}

function startListening(){

async function stopAndSend(){

}

addEventListener("keydown", e => {

  e.preventDefault(); listening ? stopAndSend() : startListening();
});
function wireDictation(){
  dictation.onPartial(({ text }) => {
    if (!listening) return;
    core.kick();
    youEl.textContent = (dictBuf + " " + text).trim();
    if (text) clearTimeout(sendTimer);
  });
  dictation.onFinal(({ text }) => {
    dictBuf += text; youEl.textContent = dictBuf.trim(); core.kick();
    // a pause after a finished phrase ends the turn, so it feels like talking, not dictating
    clearTimeout(sendTimer);
    if (listening) sendTimer = setTimeout(stopAndSend, 1700);
  });
  dictation.onState(({ state }) => {
    listening = state === "listening" || state === "starting";
    if (!listening) youEl.classList.remove("live");
    syncPhase();
  });
}

/* ---------- the 3D core ---------- */
const core = (function(){
  const api = { setPhase(){}, pulse(){}, kick(){}, setNodes(){} };
  const canvas = $("core");
  if (!window.THREE){ canvas.hidden = true; return api; }
  let renderer;
  try{ renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true }); }
  catch(e){ canvas.hidden = true; return api; }
  $("orbFallback").hidden = true;
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(38, 1, 0.1, 50); cam.position.set(0, 0, 4.5);
  const root = new THREE.Group(); scene.add(root);
  const C = { idle:new THREE.Color(0x6FD8FF), listening:new THREE.Color(0xC8F4FF), thinking:new THREE.Color(0xFFB454), speaking:new THREE.Color(0x6FD8FF) };
  const col = C.idle.clone();
  const add = THREE.AdditiveBlending;

  // particle shell
  const N = 2600, base = new Float32Array(N * 3), pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++){
    const y = 1 - 2 * (i + .5) / N, r = Math.sqrt(1 - y * y), th = i * 2.399963;
    base[i*3] = Math.cos(th) * r; base[i*3+1] = y; base[i*3+2] = Math.sin(th) * r;
  }
  const pg = new THREE.BufferGeometry(); pg.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  const pm = new THREE.PointsMaterial({ size:.022, color:col, transparent:true, opacity:.9, blending:add, depthWrite:false });
  const shell = new THREE.Points(pg, pm); root.add(shell);

  // wire heart
  const wm = new THREE.LineBasicMaterial({ color:col, transparent:true, opacity:.55, blending:add, depthWrite:false });
  const heart = new THREE.LineSegments(new THREE.WireframeGeometry(new THREE.IcosahedronGeometry(.52, 1)), wm); root.add(heart);
  const heart2 = new THREE.LineSegments(new THREE.WireframeGeometry(new THREE.OctahedronGeometry(.26, 0)), wm); root.add(heart2);

  // glow
  const gc = document.createElement("canvas"); gc.width = gc.height = 128;
  const g2 = gc.getContext("2d"), gr = g2.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, "rgba(255,255,255,.9)"); gr.addColorStop(.25, "rgba(255,255,255,.28)"); gr.addColorStop(1, "rgba(255,255,255,0)");
  g2.fillStyle = gr; g2.fillRect(0, 0, 128, 128);
  const gm = new THREE.SpriteMaterial({ map:new THREE.CanvasTexture(gc), color:col, transparent:true, opacity:.55, blending:add, depthWrite:false });
  const glow = new THREE.Sprite(gm); glow.scale.set(2.6, 2.6, 1); root.add(glow);

  // gimbal rings: broken arcs at three tilts
  const rm = new THREE.MeshBasicMaterial({ color:col, transparent:true, opacity:.5, blending:add, depthWrite:false });
  const rings = [];
  [[1.22, 1.3, [.2, 1.3, .4], .9], [1.34, 5.2, [1.25, .2, 0], .5], [1.48, 4.1, [.5, .9, .3], -.36], [1.62, 2.6, [-.7, .3, .9], .24], [1.76, 1.7, [1.5, 0, .6], -.18]].forEach(([r, arc, rot, sp]) => {
    const pivot = new THREE.Group(); pivot.rotation.set(rot[0], rot[1], rot[2]);
    const m = new THREE.Mesh(new THREE.TorusGeometry(r, .006, 6, 200, arc), rm);
    // a bead rides the leading end of every arc
    const bead = new THREE.Mesh(new THREE.SphereGeometry(.026, 10, 10), rm); bead.position.set(r, 0, 0); m.add(bead);
    pivot.add(m); root.add(pivot); rings.push({ m, sp });
  });

  // graticule: faint latitude and longitude lines around the shell
  const gratM = new THREE.LineBasicMaterial({ color:col, transparent:true, opacity:.07, blending:add, depthWrite:false });
  const grat = new THREE.LineSegments(new THREE.WireframeGeometry(new THREE.SphereGeometry(1.15, 24, 14)), gratM); root.add(grat);

  // nucleus
  const nucM = new THREE.MeshBasicMaterial({ color:0xFFFFFF, transparent:true, opacity:.95 });
  const nuc = new THREE.Mesh(new THREE.IcosahedronGeometry(.085, 2), nucM); root.add(nuc);

  // instrument dial: 120 ticks, every fifth longer, every tenth longest
  const tp = [];
  for (let i = 0; i < 120; i++){
    const a = i / 120 * Math.PI * 2, r1 = 1.9, r2 = i % 10 === 0 ? 2.03 : i % 5 === 0 ? 1.97 : 1.935;
    tp.push(Math.cos(a) * r1, Math.sin(a) * r1, 0, Math.cos(a) * r2, Math.sin(a) * r2, 0);
  }
  const tg = new THREE.BufferGeometry(); tg.setAttribute("position", new THREE.Float32BufferAttribute(tp, 3));
  const dialM = new THREE.LineBasicMaterial({ color:col, transparent:true, opacity:.4, blending:add, depthWrite:false });
  const dial = new THREE.LineSegments(tg, dialM); dial.rotation.x = -1.18; root.add(dial);
  const dial2 = new THREE.LineSegments(tg, dialM); dial2.rotation.x = -1.18; dial2.scale.setScalar(.62); dial2.position.y = -.5; root.add(dial2);

  // far dust
  const DN = 700, dp = new Float32Array(DN * 3);
  for (let i = 0; i < DN; i++){
    const u = Math.random() * 2 - 1, th = Math.random() * Math.PI * 2, r = 2.3 + Math.random() * 2.2, q = Math.sqrt(1 - u * u);
    dp[i*3] = Math.cos(th) * q * r; dp[i*3+1] = u * r * .7; dp[i*3+2] = Math.sin(th) * q * r;
  }
  const dg = new THREE.BufferGeometry(); dg.setAttribute("position", new THREE.BufferAttribute(dp, 3));
  const dustM = new THREE.PointsMaterial({ size:.013, color:col, transparent:true, opacity:.45, blending:add, depthWrite:false });
  const dust = new THREE.Points(dg, dustM); scene.add(dust);

  // one satellite per captured key point, in the colour of its kind
  const sats = new THREE.Group(); root.add(sats);
  const satGeo = new THREE.SphereGeometry(.034, 12, 12);
  let satKey = "";
  function setNodes(colors){
    const key = colors.join(","); if (key === satKey) return; satKey = key;
    while (sats.children.length){ const c = sats.children.pop(); c.children[0].material.dispose(); }
    colors.forEach((hex, i) => {
      const pivot = new THREE.Group();
      pivot.rotation.set(i * 1.31, i * .77, i * 2.1);
      pivot.userData.sp = (.22 + (i % 5) * .05) * (i % 2 ? -1 : 1);
      pivot.rotation.z += i * 2.4;
      const m = new THREE.Mesh(satGeo, new THREE.MeshBasicMaterial({ color:hex }));
      m.position.set(1.27 + (i % 3) * .06, 0, 0);
      pivot.add(m); sats.add(pivot);
    });
  }
  const tinted = [pm, wm, gm, rm, gratM, dialM, dustM];

  // pulse sent out when a key point is captured
  const pulses = [];
  function pulse(){
    const m = new THREE.Mesh(new THREE.RingGeometry(.98, 1, 96), new THREE.MeshBasicMaterial({ color:0xFFFFFF, transparent:true, opacity:.9, blending:add, depthWrite:false, side:THREE.DoubleSide }));
    scene.add(m); pulses.push({ m, t:0 });
  }

  const P = { idle:{ amp:.035, spin:.14, scale:1 }, listening:{ amp:.09, spin:.26, scale:1.07 }, thinking:{ amp:.02, spin:1.5, scale:.9 }, speaking:{ amp:.06, spin:.34, scale:1 } };
  let ph = "idle", amp = .035, spin = .14, scale = 1, env = 0, envT = 0, kickV = 0, mx = 0, my = 0, rot = 0;
  addEventListener("pointermove", e => { mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5; });

  function size(){
    const w = orbwrap.clientWidth, h = orbwrap.clientHeight; if (!w || !h) return;
    renderer.setSize(w, h, false); cam.aspect = w / h;
    // keep the outer ring inside the frame on tall, narrow stages
    cam.position.z = cam.aspect < 1 ? 4.5 / Math.max(cam.aspect, .45) * 1.05 : 4.5;
    cam.updateProjectionMatrix();
  }
  if (window.ResizeObserver) new ResizeObserver(() => { size(); drawLeads(); }).observe(orbwrap); else addEventListener("resize", size);
  size();

  let last = performance.now(), time = 0;
  function frame(now){
    const dt = Math.min((now - last) / 1000, .05); last = now; time += dt;
    const T = P[ph], k = 1 - Math.pow(.02, dt);
    if (ph === "speaking" && !reduceMotion){ envT -= dt; if (envT <= 0){ envT = .07 + Math.random() * .09; env = .25 + Math.random() * .75; } } else env = 0;
    kickV *= Math.pow(.04, dt);
    const speech = ph === "speaking" ? env * .14 : 0;
    amp += (T.amp + speech + kickV * .1 - amp) * k * 2.2;
    spin += (T.spin - spin) * k; scale += (T.scale + speech * .35 - scale) * k * 1.6;
    col.lerp(C[ph], k);
    for (const m of tinted) m.color.copy(col);   // three copies a colour passed to a material, so push it each frame
    const sp = reduceMotion ? spin * .25 : spin;
    rot += dt * sp;
    const t = time * (reduceMotion ? .3 : 1);
    for (let i = 0; i < N; i++){
      const x = base[i*3], y = base[i*3+1], z = base[i*3+2];
      const r = 1 + amp * (Math.sin(x * 3.1 + t * 1.6) + Math.sin(y * 4.3 - t * 1.2) + Math.sin(z * 5.2 + t * .9));
      pos[i*3] = x * r; pos[i*3+1] = y * r; pos[i*3+2] = z * r;
    }
    pg.attributes.position.needsUpdate = true;
    shell.rotation.y = rot * .6; shell.rotation.x = Math.sin(t * .2) * .15;
    heart.rotation.set(rot * .9, rot * 1.3, 0); heart2.rotation.set(-rot * 1.7, rot * .8, rot);
    heart.scale.setScalar(1 + amp * 1.4);
    for (const r of rings) r.m.rotation.z += dt * r.sp * (sp / .14) * .6;
    glow.material.opacity = .4 + amp * 2.2;
    grat.rotation.y = -rot * .25; dial.rotation.z = rot * .3; dial2.rotation.z = -rot * .5;
    dust.rotation.y = time * .012;
    nuc.scale.setScalar(1 + Math.sin(t * 2.2) * .12 + amp * 2.5);
    for (const sv of sats.children) sv.rotateZ(dt * sv.userData.sp * (reduceMotion ? .3 : 1));
    root.scale.setScalar(scale);
    root.rotation.y += ((mx * .5) - root.rotation.y) * k; root.rotation.x += ((my * .35) - root.rotation.x) * k;
    for (let i = pulses.length - 1; i >= 0; i--){
      const p = pulses[i]; p.t += dt;
      p.m.scale.setScalar(1 + p.t * 2.4); p.m.material.opacity = Math.max(0, .9 - p.t * .9);
      if (p.t > 1){ scene.remove(p.m); p.m.geometry.dispose(); p.m.material.dispose(); pulses.splice(i, 1); }
    }
    renderer.render(scene, cam);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  api.setPhase = p => { ph = P[p] ? p : "idle"; };
  api.setNodes = setNodes;
  api.pulse = pulse;
  api.kick = () => { kickV = 1; };
  return api;
})();

/* ---------- boot ---------- */
syncLang(); syncVoiceBtn(); renderCards(); renderTalk(); syncPhase();
const last = [...turns].reverse();
const lastJ = last.find(t => t.role === "jarvis"), lastU = last.find(t => t.role === "user");
if (lastJ){ sayEl.textContent = lastJ.text; if (lastU) youEl.textContent = lastU.text; }

const use = n => (window.claude && typeof window.claude.use === "function") ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
syncLinks();
Promise.all([use("sample"), use("dictation"), use("tts"), use("mcp")]).then(async ([s, d, t, m]) => {
  sample = s; dictation = d; tts = t; mcp = m; capsReady = true;
  if (sample){ try{ toolsOk = !!(await sample.limits()).tools; }catch(e){ toolsOk = false; } }
  // the browser only lists inside the Claude desktop app; listing never asks the viewer anything
  if (mcp){ try{ const l = await mcp.listTools(BROWSER); webOn = (l.servers || []).some(x => x.server === BROWSER); }catch(e){ webOn = false; } }
  syncLinks();
  if (dictation){ micBtn.hidden = false; wireDictation(); hintEl.textContent = "Tryck på mikrofonen eller mellanslag och prata. En paus skickar det du sa."; }
  else hintEl.textContent = sample ? "Mikrofonen finns inte i den här vyn (kräver Chrome eller Claude-appen på dator). Skriv i stället." : "";
  if (tts){
    tts.onState(({ state }) => { speaking = state === "speaking" || state === "starting"; syncPhase(); });
    try{ ttsLangs = tts.languages ? await tts.languages() : null; }catch(e){ ttsLangs = null; }
  }
  if (!sample) fail("Jarvis hjärna är bara ansluten när sidan öppnas inloggad på claude.ai.");
  syncVoiceBtn(); syncPhase();
});
})();
</script>
